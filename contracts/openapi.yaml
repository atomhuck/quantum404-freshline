openapi: 3.0.3
info:
  title: FreshLine API
  version: 1.0.0
  description: Contract-first API for one synthetic restaurant demo. Business writes require a session, CSRF token, and Idempotency-Key; session exchange is the bootstrap exception.
servers:
  - url: /api/v1
tags:
  - name: catalog
    description: Public read-only views of the synthetic restaurant catalogue.
  - name: stock
    description: Delivery intake and batch-level inventory views.
  - name: orders
    description: Idempotent all-or-nothing restaurant orders.
  - name: insight
    description: Explainable availability, expiry, and replenishment views.
  - name: demo
    description: Demo session bootstrap and committed change stream.
paths:
  /session:
    post:
      tags: [demo]
      operationId: createDemoSession
      summary: Exchange demo access code for a Secure HttpOnly session and CSRF token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessCode]
              properties:
                accessCode: {type: string, minLength: 1}
      responses:
        '200':
          description: Cookie session plus CSRF token for X-CSRF-Token
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: {type: string}
              example:
                csrfToken: example-csrf-token
        '401': {description: Invalid access code}
        '429': {description: Rate limit}
  /ingredients:
    get:
      tags: [catalog]
      operationId: listIngredients
      summary: List ingredients and their base units
      security: []
      responses:
        '200':
          description: Ingredient catalogue
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Ingredient'}
  /dishes:
    get:
      tags: [catalog]
      operationId: listDishes
      summary: List dishes with their current recipe versions
      security: []
      responses:
        '200':
          description: Current recipes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Dish'}
  /deliveries:
    post:
      tags: [stock]
      operationId: receiveDelivery
      summary: Receive all lines of a delivery as inventory batches
      security: [{demoSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryRequest'}
            examples:
              calculatedExpiry:
                summary: Expiry date calculated from manufacture date and shelf life
                value:
                  supplier: Demo supplier
                  deliveryNumber: D-2026-0001
                  receivedAt: '2026-10-13T09:00:00Z'
                  lines:
                    - ingredientId: 11111111-1111-4111-8111-111111111111
                      quantity: '1250.500'
                      manufacturedOn: '2026-10-12'
                      shelfLifeDays: 7
                      expirySource: calculated
              supplierLabelExpiry:
                summary: Expiry date copied from a supplier label
                value:
                  supplier: Demo supplier
                  deliveryNumber: D-2026-0002
                  receivedAt: '2026-10-13T09:05:00Z'
                  lines:
                    - ingredientId: 11111111-1111-4111-8111-111111111111
                      quantity: '800.000'
                      supplierExpiresOn: '2026-10-20'
                      expirySource: supplier_label
      responses:
        '201':
          description: Created delivery and batches
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResult'}
              example:
                id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                deliveryNumber: D-2026-0001
                batchIds: [bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb]
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /stock:
    get:
      tags: [stock]
      operationId: getStock
      summary: Get aggregate and batch-level stock
      security: []
      responses:
        '200':
          description: Aggregate and batch-level stock
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StockItem'}
              example:
                - ingredientId: 11111111-1111-4111-8111-111111111111
                  usableQuantity: '1000.000'
                  totalQuantity: '1300.000'
                  batches:
                    - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                      remainingQuantity: '1000.000'
                      expiresOn: '2026-10-18'
                      daysRemaining: 5
                      state: fresh
                    - id: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                      remainingQuantity: '300.000'
                      expiresOn: '2026-10-12'
                      daysRemaining: -1
                      state: expired
  /orders:
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Place an idempotent all-or-nothing order
      security: [{demoSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderRequest'}
            example:
              source: web
              externalId: POS-20261013-0001
              items:
                - dishId: 22222222-2222-4222-8222-222222222222
                  servings: 2
      responses:
        '201':
          description: Accepted order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResult'}
        '409':
          description: Insufficient stock or idempotency conflict. No stock consumed for rejected order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get a previously persisted order outcome
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Order outcome
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResult'}
              example:
                id: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                status: accepted
                items:
                  - dishId: 22222222-2222-4222-8222-222222222222
                    recipeVersion: 1
                    servings: 2
                consumption:
                  - batchId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    ingredientId: 11111111-1111-4111-8111-111111111111
                    quantity: '240.000'
        '404': {description: Unknown order}
  /stop-list:
    get:
      tags: [insight]
      operationId: getStopList
      summary: List unavailable dishes with their shortages
      security: []
      responses:
        '200':
          description: Unavailable dishes and missing ingredients
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StopListEntry'}
  /hot-offers:
    get:
      tags: [insight]
      operationId: getHotOffers
      summary: List available dishes with explainable expiry priority
      security: []
      responses:
        '200':
          description: Available dishes ordered by explainable expiry priority
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/HotOffer'}
  /replenishment:
    get:
      tags: [insight]
      operationId: getReplenishment
      summary: Get explainable target-stock advice
      security: []
      responses:
        '200':
          description: Simple target-stock advice with explanation
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ReplenishmentAdvice'}
  /events:
    get:
      tags: [demo]
      operationId: streamEvents
      summary: Stream committed inventory and order changes
      security: []
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string}
      responses:
        '200':
          description: SSE of committed state changes; client refetches snapshots after reconnect
          content:
            text/event-stream:
              schema: {type: string}
components:
  securitySchemes:
    demoSession:
      type: apiKey
      in: cookie
      name: FRESHLINE_SESSION
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: VALIDATION_FAILED
            message: Request validation failed
            requestId: 00000000-0000-4000-8000-000000000001
            details:
              lines: must contain at least one item
    Unauthorized:
      description: Login or CSRF required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Duplicate identifier or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            idempotencyPayloadMismatch:
              summary: Key was already used with a different request body
              value:
                code: IDEMPOTENCY_CONFLICT
                message: Idempotency key was already used for a different request
                requestId: 00000000-0000-4000-8000-000000000002
            insufficientStock:
              summary: Order rejected without partial consumption
              value:
                code: INSUFFICIENT_STOCK
                message: Order rejected because required ingredients are unavailable
                requestId: 00000000-0000-4000-8000-000000000003
                details:
                  shortage:
                    - ingredientId: 11111111-1111-4111-8111-111111111111
                      required: '240.000'
                      available: '100.000'
                      missing: '140.000'
  schemas:
    Ingredient:
      type: object
      required: [id, name, baseUnit]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        baseUnit: {type: string, enum: [g, ml, pcs]}
        reorderPoint: {type: string, description: Decimal base units}
    Dish:
      type: object
      required: [id, name, recipeVersion, items]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        recipeVersion: {type: integer, minimum: 1}
        items:
          type: array
          items: {$ref: '#/components/schemas/RecipeItem'}
    RecipeItem:
      type: object
      required: [ingredientId, quantityPerServing]
      properties:
        ingredientId: {type: string, format: uuid}
        quantityPerServing: {type: string, description: Positive decimal in ingredient base unit}
    DeliveryRequest:
      type: object
      required: [supplier, deliveryNumber, receivedAt, lines]
      properties:
        supplier: {type: string, minLength: 1}
        deliveryNumber: {type: string, minLength: 1}
        receivedAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [ingredientId, quantity]
            properties:
              ingredientId: {type: string, format: uuid}
              quantity: {type: string, description: Positive decimal base units}
              manufacturedOn: {type: string, format: date}
              shelfLifeDays: {type: integer, minimum: 1}
              supplierExpiresOn: {type: string, format: date}
              expirySource: {type: string, enum: [calculated, supplier_label]}
    DeliveryResult:
      type: object
      required: [id, deliveryNumber, batchIds]
      properties:
        id: {type: string, format: uuid}
        deliveryNumber: {type: string}
        batchIds:
          type: array
          items: {type: string, format: uuid}
    StockItem:
      type: object
      required: [ingredientId, usableQuantity, totalQuantity, batches]
      properties:
        ingredientId: {type: string, format: uuid}
        usableQuantity: {type: string}
        totalQuantity: {type: string}
        batches:
          type: array
          items: {$ref: '#/components/schemas/BatchView'}
    BatchView:
      type: object
      required: [id, remainingQuantity, expiresOn, daysRemaining, state]
      properties:
        id: {type: string, format: uuid}
        remainingQuantity: {type: string}
        expiresOn: {type: string, format: date}
        daysRemaining: {type: integer}
        state: {type: string, enum: [fresh, expiring, expired]}
    OrderRequest:
      type: object
      required: [source, externalId, items]
      properties:
        source: {type: string, enum: [web, simulator]}
        externalId: {type: string, minLength: 1}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dishId, servings]
            properties:
              dishId: {type: string, format: uuid}
              servings: {type: integer, minimum: 1}
    OrderResult:
      type: object
      required: [id, status, items, consumption]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [accepted, rejected]}
        items:
          type: array
          items: {type: object}
        consumption:
          type: array
          items: {$ref: '#/components/schemas/ConsumptionView'}
        shortage:
          type: array
          items: {$ref: '#/components/schemas/Shortage'}
    ConsumptionView:
      type: object
      required: [batchId, ingredientId, quantity]
      properties:
        batchId: {type: string, format: uuid}
        ingredientId: {type: string, format: uuid}
        quantity: {type: string}
    Shortage:
      type: object
      required: [ingredientId, required, available, missing]
      properties:
        ingredientId: {type: string, format: uuid}
        required: {type: string}
        available: {type: string}
        missing: {type: string}
    StopListEntry:
      type: object
      required: [dishId, shortages]
      properties:
        dishId: {type: string, format: uuid}
        shortages:
          type: array
          items: {$ref: '#/components/schemas/Shortage'}
    HotOffer:
      type: object
      required: [dishId, score, possibleServings, reasons]
      properties:
        dishId: {type: string, format: uuid}
        score: {type: number, minimum: 0}
        possibleServings: {type: integer, minimum: 1}
        reasons:
          type: array
          items: {type: string}
    ReplenishmentAdvice:
      type: object
      required: [ingredientId, suggestedQuantity, basis]
      properties:
        ingredientId: {type: string, format: uuid}
        suggestedQuantity: {type: string}
        basis: {type: string, enum: [recent_consumption, reorder_point, insufficient_history]}
        explanation: {type: string}
    Problem:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        details: {type: object, additionalProperties: true}
