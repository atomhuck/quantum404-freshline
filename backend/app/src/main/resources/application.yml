server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: FRESHLINE_SESSION
        http-only: true
        secure: ${FRESHLINE_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

spring:
  mvc:
    throw-exception-if-no-handler-found: true
    problemdetails:
      enabled: false
