name: freshline

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshline}
      POSTGRES_USER: ${POSTGRES_USER:-freshline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freshline}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-freshline}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
      FRESHLINE_DEMO_ACCESS_CODE: ${FRESHLINE_DEMO_ACCESS_CODE:?Set FRESHLINE_DEMO_ACCESS_CODE in the private .env file}
      FRESHLINE_COOKIE_SECURE: ${FRESHLINE_COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    expose:
      - "4173"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

  simulator:
    profiles: [demo]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080/api/v1
      FRESHLINE_DEMO_ACCESS_CODE: ${FRESHLINE_DEMO_ACCESS_CODE:?Set FRESHLINE_DEMO_ACCESS_CODE in the private .env file}
      DEMO_SEED: ${DEMO_SEED:-404}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-15}
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
